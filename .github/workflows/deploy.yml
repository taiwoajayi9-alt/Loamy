name: Deploy app

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DEPLOY: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' }}

    steps:
      - name: Skip until deploy settings exist
        if: env.HAS_DEPLOY != 'true'
        run: echo "Deploy secrets not set yet; nothing to do."

      - uses: actions/checkout@v4
        if: env.HAS_DEPLOY == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: env.HAS_DEPLOY == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: env.HAS_DEPLOY == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://app.loamy.farm' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://kimietimcjqdeomihnsw.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_qcSDPYTQ3CuyPYMghVXgzQ_DZgR_41M' }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npx next build
          mkdir -p bundle/app/.next
          cp -r .next/standalone/. bundle/app/
          cp -r .next/static bundle/app/.next/static
          cp -r public bundle/app/public
          cp deploy/app.js bundle/app.js
          du -sh bundle

      - name: Configure SSH
        id: configure_ssh
        if: env.HAS_DEPLOY == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          if printf '%s' "$KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$KEY" | tr -d '\r' > "$HOME/.ssh/deploy"
          else
            printf '%s' "$KEY" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy"
          fi
          chmod 600 "$HOME/.ssh/deploy"
          if ! ssh-keygen -y -f "$HOME/.ssh/deploy" > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a usable private key."
            exit 1
          fi
          ssh-keyscan -p 21098 "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Upload and switch application
        if: env.HAS_DEPLOY == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -p 21098 -i $HOME/.ssh/deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'mkdir -p ~/loamy-app/tmp && if [ -f ~/loamy-app/.deploy-in-progress ]; then echo "An earlier deployment needs recovery. Stopping."; exit 1; fi && rm -rf ~/loamy-app/app.next && rm -f ~/loamy-app/app.js.next'
          rsync -az --delete -e "$SSH" bundle/app/ "$USER@$HOST:loamy-app/app.next/"
          rsync -az -e "$SSH" bundle/app.js "$USER@$HOST:loamy-app/app.js.next"
          $SSH "$USER@$HOST" 'cd ~/loamy-app && rm -rf app.old && rm -f app.js.old && touch .deploy-in-progress && { [ -d app ] && mv app app.old || true; } && { [ -f app.js ] && mv app.js app.js.old || true; } && mv app.next app && mv app.js.next app.js && touch tmp/restart.txt'
          echo "New application version switched in."

      - name: Check application health
        if: env.HAS_DEPLOY == 'true'
        env:
          URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://app.loamy.farm' }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$URL/discover" || true)
            echo "Attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed. Previous version will be restored."
          exit 1

      - name: Finalize successful deployment
        if: success() && env.HAS_DEPLOY == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p 21098 -i "$HOME/.ssh/deploy" -o BatchMode=yes "$USER@$HOST" 'cd ~/loamy-app && rm -rf app.old && rm -f app.js.old .deploy-in-progress'
          echo "Deployment verified. Previous version safely retired."

      - name: Deploy landing page
        if: success() && env.HAS_DEPLOY == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -p 21098 -i $HOME/.ssh/deploy -o BatchMode=yes"
          if $SSH "$USER@$HOST" 'test -d ~/loamy.farm'; then
            rsync -az -e "$SSH" landing/ "$USER@$HOST:loamy.farm/"
            echo "Landing page deployed."
          else
            echo "Landing page directory not found; skipped."
          fi

      - name: Restore previous version after failure
        if: failure() && env.HAS_DEPLOY == 'true' && steps.configure_ssh.outcome == 'success'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        continue-on-error: true
        run: |
          ssh -p 21098 -i "$HOME/.ssh/deploy" -o BatchMode=yes "$USER@$HOST" '
            cd ~/loamy-app
            if [ -f .deploy-in-progress ]; then
              if [ -d app.old ]; then
                rm -rf app
                mv app.old app
              else
                rm -rf app
              fi
              if [ -f app.js.old ]; then
                rm -f app.js
                mv app.js.old app.js
              else
                rm -f app.js
              fi
              rm -f .deploy-in-progress
              touch tmp/restart.txt
              echo "Previous application version restored."
            else
              echo "No incomplete application switch to roll back."
            fi
          '
